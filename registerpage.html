<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CubeBot — Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="register-section">
    <h1>CubeBot</h1>
    <p>Create an account to get started.</p>

    <form id="register-form">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" name="username" placeholder="Choose a username" required />

      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" name="email" placeholder="Enter your email" required />

      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" name="password" placeholder="Choose a password" required />

      <label for="reg-confirm">Confirm Password</label>
      <input type="password" id="reg-confirm" name="confirm" placeholder="Repeat your password" required />

      <p id="register-error" style="color: red;"></p>
      <p id="register-success" style="color: green;"></p>

      <button type="submit">Create Account</button>
    </form>

    <p>Already have an account? <a href="loginpage.html">Login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script> 
</body>
</html>
